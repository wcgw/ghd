name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ghd's own code, without voight: fast, and what every change touches.
  check:
    name: Format, lints and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets --no-default-features
      - name: Tests
        run: cargo test --no-default-features

  # With voight, whose candle dependencies are slow to build and are what breaks: a build only, no tests, as its
  # model isn't fetched here.
  voight:
    name: Build with voight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lints
        run: cargo clippy --all-targets
