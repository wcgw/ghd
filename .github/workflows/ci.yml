name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# The checks every wcgw app runs, as wcgw-kit does: format, lints as errors and tests on Linux, against the
# locked dependencies; a build on macOS, which is best effort.
jobs:
  lint:
    name: Format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # voight is optional: the app builds, and its lints and tests pass, without it too.
      - name: Lints without voight
        run: cargo clippy --workspace --all-targets --locked --no-default-features -- -D warnings
      # On the fork of candle that has its wgpu backend: the build most likely to break.
      - name: Lints with wgpu
        run: cargo clippy --workspace --all-targets --locked --features wgpu -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace --locked
      - name: Tests without voight
        run: cargo test --workspace --locked --no-default-features

  macos:
    name: Build on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --locked
