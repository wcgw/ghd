[package]
name = "ghd"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
http = "1.5.0"
octocrab = { version = "0.54", default-features = false, features = ["default-client", "rustls", "rustls-ring", "follow-redirect", "retry"] }
open = "5.4.4"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "process", "time", "fs"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
serde_json = "1.0.154"
wiremock = "0.6.5"
