[package]
name = "ghd"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
http = "1.5.0"
octocrab = { version = "0.54", default-features = false, features = ["default-client", "rustls", "rustls-ring", "follow-redirect", "retry"] }
open = "5.4.4"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
ring = { version = "0.17.14", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Code in Markdown, highlighted: syntect with its pure-Rust regex engine, and bat's syntaxes from two-face, which
# has TOML, TypeScript, Dockerfiles and such that syntect's own lack.
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "process", "time", "fs", "io-util", "sync"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }
tui-markdown = { version = "0.3.12", default-features = false }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
# voight's main, pinned: the library isn't published.
voight = { git = "https://github.com/wcgw/voight", rev = "5f219e54eb124e7f74035e653b0677e602c4a8b5", default-features = false, optional = true }

[dev-dependencies]
wiremock = "0.6.5"

[lints.rust]
# ghd has none, and needs none: keep it that way.
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# `Theme` is 800 bytes of `Style`, and `Copy`. Passing it by value is what the UI does throughout; narrowing that to
# `&Theme` is worth doing, but as one change rather than lint by lint.
large_types_passed_by_value = "allow"
# It reads the Notification a test is about as too close to the one it was fetched from, and such.
similar_names = "allow"

[features]
default = ["voight"]
# Assessments of Previews' text, by voight's model (about 1.7 GB, loaded at startup unless `voight = "off"`).
voight = ["dep:voight"]
# voight on an NVIDIA GPU (`voight = "cuda"`): CUDA in voight and the candle crates it runs its model with. Needs
# the CUDA toolkit (`nvcc`) to build.
cuda = ["voight", "voight/cuda"]
# voight on a Mac's GPU (`voight = "metal"`): Metal in voight and its candle crates. Already on for Apple silicon,
# where voight always builds with Metal.
metal = ["voight", "voight/metal"]

# voight's model is unusably slow unoptimized (an Assessment didn't finish in five minutes): dependencies are built
# optimized even in debug builds, which keep ghd's own code easy to debug.
[profile.dev.package."*"]
opt-level = 3
