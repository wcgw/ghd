# The terminal's own colors, with emphasis only: how ghd looked before it had themes.

[styles]
tab_current = { reversed = true }
cursor = { reversed = true }
selected = { bold = true }
unread = { bold = true }
read = { dim = true }
error = { fg = "red" }
completion = { dim = true }
completion_current = { reversed = true }
help_keys = { bold = true }
help_heading = { dim = true }

[styles.diff]
added = { fg = "green" }
removed = { fg = "red" }
changed = { fg = "yellow" }

[styles.ci]
passing = { fg = "green" }
failing = { fg = "red" }
pending = { fg = "yellow" }

[styles.markdown]
heading = { bold = true }
link = { underlined = true }
quote = { italic = true }
muted = { dim = true }

[styles.state]
open = { fg = "green" }
draft = { dim = true }
merged = { fg = "magenta" }
closed = { fg = "red" }
completed = { fg = "magenta" }
not_planned = { dim = true }

# voight's Heatmap (`H`): the terminal's green, yellow and red, stepped between rather than blended.
[styles.heatmap]
human = { fg = "black", bg = "green" }
even = { fg = "black", bg = "yellow" }
llm = { fg = "black", bg = "red" }

# Code in Markdown: the terminal's colors.
[styles.syntax]
comment = { dim = true, italic = true }
keyword = { fg = "magenta" }
string = { fg = "green" }
constant = { fg = "yellow" }
function = { fg = "blue" }
type = { fg = "cyan" }
