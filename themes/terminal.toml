# The terminal's own colors, with emphasis only: how ghd looked before it had themes.

[styles]
tab_current = { reversed = true }
cursor = { reversed = true }
selected = { bold = true }
unread = { bold = true }
read = { dim = true }
error = { fg = "red" }
completion = { dim = true }
completion_current = { reversed = true }
help_keys = { bold = true }
help_heading = { dim = true }

[styles.markdown]
heading = { bold = true }
link = { underlined = true }
quote = { italic = true }
muted = { dim = true }

[styles.state]
open = { fg = "green" }
draft = { dim = true }
merged = { fg = "magenta" }
closed = { fg = "red" }
completed = { fg = "magenta" }
not_planned = { dim = true }
