# Tokyo Night Moon, ghd's default theme.
# The palette is the "moon" style of https://github.com/folke/tokyonight.nvim (lua/tokyonight/colors/moon.lua).

[palette]
bg = "#222436"
bg_dark = "#1e2030"
bg_dark1 = "#191b29"
bg_highlight = "#2f334d"
blue = "#82aaff"
blue0 = "#3e68d7"
blue1 = "#65bcff"
blue2 = "#0db9d7"
blue5 = "#89ddff"
blue6 = "#b4f9f8"
blue7 = "#394b70"
comment = "#636da6"
cyan = "#86e1fc"
dark3 = "#545c7e"
dark5 = "#737aa2"
fg = "#c8d3f5"
fg_dark = "#828bb8"
fg_gutter = "#3b4261"
green = "#c3e88d"
green1 = "#4fd6be"
green2 = "#41a6b5"
magenta = "#c099ff"
magenta2 = "#ff007c"
orange = "#ff966c"
purple = "#fca7ea"
red = "#ff757f"
red1 = "#c53b53"
teal = "#4fd6be"
terminal_black = "#444a73"
yellow = "#ffc777"

[styles]
# No `bg`: the terminal's own background shows through.
text = { fg = "fg" }
border = { fg = "dark3" }
tab = { fg = "dark5" }
tab_current = { fg = "bg", bg = "blue", bold = true }
cursor = { bg = "bg_highlight" }
selected = { fg = "yellow", bg = "blue7" }
unread = { bold = true }
read = { fg = "comment" }
read_state = { dim = true }
unread_marker = { fg = "orange" }
repository = { fg = "blue" }
title = { fg = "fg" }
reason = { fg = "magenta" }
age = { fg = "dark5" }
message = { fg = "comment", italic = true }
error = { fg = "red" }
status = { fg = "fg_dark" }
prompt = { fg = "fg" }
completion = { fg = "dark5" }
completion_current = { fg = "bg", bg = "blue1" }
search = { fg = "yellow" }
fetching = { fg = "blue1", italic = true }
hint = { fg = "dark3" }
help_keys = { fg = "blue1", bold = true }
help_heading = { fg = "comment" }
voight = { fg = "magenta" }

[styles.diff]
added = { fg = "green" }
removed = { fg = "red" }
changed = { fg = "yellow" }

[styles.ci]
passing = { fg = "green" }
failing = { fg = "red" }
pending = { fg = "yellow" }

[styles.markdown]
heading = { fg = "blue", bold = true }
code = { fg = "green1" }
link = { fg = "blue1", underlined = true }
quote = { fg = "fg_dark", italic = true }
muted = { fg = "dark5" }

[styles.kind]
pull_request = { fg = "green" }
issue = { fg = "yellow" }
release = { fg = "cyan" }
discussion = { fg = "purple" }
commit = { fg = "teal" }
check_suite = { fg = "orange" }
other = { fg = "dark5" }

# Like GitHub: green open, grey draft or not planned, purple merged or completed, red closed.
[styles.state]
open = { fg = "green" }
draft = { fg = "dark5" }
merged = { fg = "magenta" }
closed = { fg = "red" }
completed = { fg = "magenta" }
not_planned = { fg = "dark5" }
